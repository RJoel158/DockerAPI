services:
  # 7, 10, 12, 13. Servicio de Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 12. Persistencia de datos mediante volumen con nombre
      - postgres_data:/var/lib/postgresql/data
    networks:
      # 16. Red compartida de Docker Compose
      - app-network
    # 13. Healthcheck para verificar disponibilidad de PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3, 9, 10, 14, 15. Servicio API REST Node.js
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: node_api
    # 15. Reinicio automático en caso de detención inesperada
    restart: on-failure
    environment:
      API_PORT: ${API_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      # 11, 16. Comunicación entre contenedores por nombre de servicio (DNS interno)
      POSTGRES_HOST: postgres
    ports:
      - "${API_PORT:-3000}:3000"
    # 14. Dependencia esperando que PostgreSQL esté con healthcheck 'healthy'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

# 12. Definición del volumen con nombre para la persistencia
volumes:
  postgres_data:
    name: postgres_data

# 16. Red interna de Docker Compose
networks:
  app-network:
    driver: bridge
